name: Seed Production Database

# Phase 21: same behavior as before, now on the reviewer-gated production
# Environment's secrets instead of repository-level DEPLOY_* secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEED PRODUCTION to confirm — this TRUNCATEs and reseeds the live menu tables'
        required: true

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify confirmation phrase
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "SEED PRODUCTION" ]; then
            echo "Confirmation phrase did not match 'SEED PRODUCTION'. Aborting." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/ssh-target
        with:
          host: ${{ vars.DEPLOY_HOST }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Backup, seed, and verify
        run: |
          ssh target 'set -euo pipefail
            cd /opt/zainstreat
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            TS=$(date +%Y%m%d-%H%M%S)
            mkdir -p backups
            echo "Backing up to backups/backup-${TS}.sql"
            $COMPOSE exec -T postgres sh -c '"'"'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB"'"'"' > "backups/backup-${TS}.sql"
            test -s "backups/backup-${TS}.sql"
            echo "Backup OK ($(wc -l < "backups/backup-${TS}.sql") lines)."'

          echo "Seeding..."
          ssh target 'cd /opt/zainstreat && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres sh -c '"'"'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'"'"'' < apps/api/seed.sql
          echo "Seed applied."

          echo "Verifying..."
          ssh target 'cd /opt/zainstreat && docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres sh -c '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT count(*) FROM categories;" -c "SELECT count(*) FROM menu_items;"'"'"''
