name: CI

# Phase 21: tests and checks only. Images are built by build.yml once this
# passes on master; nothing here deploys.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zainstreat_test
          POSTGRES_PASSWORD: zainstreat_test
          POSTGRES_DB: zainstreat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zainstreat_test -d zainstreat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Actions' `services:` block can't override a container's
      # command (needed for alpine/minio's `server /data ...` args — see
      # docker-compose.yml's comment on this image), so MinIO runs as a
      # plain background container instead, reachable at localhost:9000
      # exactly like the Postgres service above. `-u 0:0` works around the
      # same non-root-can't-write-to-/data issue docker-compose.yml notes.
      - name: Start MinIO
        run: |
          docker run -d --name minio -u 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=zainstreat_test \
            -e MINIO_ROOT_PASSWORD=zainstreat_test \
            alpine/minio:RELEASE.2025-10-15T17-29-55Z server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1

      - name: Run API tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://zainstreat_test:zainstreat_test@localhost:5432/zainstreat_test
          SQLX_OFFLINE: "true"
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: zainstreat_test
          MINIO_SECRET_KEY: zainstreat_test
        run: cargo test

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
