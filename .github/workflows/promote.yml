name: Promote

# Phase 21: the only way production changes. Deploys images build.yml
# already built for a commit — never rebuilds. Leave `sha` empty to ship
# the latest master commit; rollback is this workflow with an earlier SHA
# (see the Deployments page for what ran when).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Leave empty to deploy the latest master commit. For a rollback, a full earlier commit SHA from the Deployments page.
        required: false
        default: ""
      allow_env_changes:
        description: Comma-separated .env keys allowed to change value (leave empty unless a secret was deliberately changed)
        required: false
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  # No `environment:` here, so these checks run before anyone is asked to
  # approve.
  verify:
    runs-on: ubuntu-latest
    outputs:
      repo: ${{ steps.check.outputs.repo }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Check the SHA
        id: check
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # Empty = the commit this run was started from (master's head).
          # Pasted values often carry stray spaces or capitals.
          sha=$(printf '%s' "$INPUT_SHA" | tr -d '[:space:]' | tr 'A-F' 'a-f')
          sha=${sha:-$HEAD_SHA}
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be empty (latest master) or a full 40-character commit SHA."; exit 1; }
          echo "Deploying $sha"
          {
            echo "sha=$sha"
            echo "owner=${OWNER,,}"
            echo "repo=ghcr.io/${OWNER,,}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the images exist
        uses: ./.github/actions/ghcr-image-exists
        with:
          images: ${{ steps.check.outputs.owner }}/zainstreat-api ${{ steps.check.outputs.owner }}/zainstreat-web
          tag: ${{ steps.check.outputs.sha }}
          token: ${{ github.token }}

      # Decision 22: without the cms record, Caddy's ACME attempts fail
      # and burn rate limit, and the health check can never pass.
      - name: Check cms DNS
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          PROD_HOST: ${{ vars.PROD_DEPLOY_HOST }}
        run: |
          test -n "$PROD_HOST" || { echo "::error::Set the PROD_DEPLOY_HOST repository variable."; exit 1; }
          got=$(dig +short "cms.$DOMAIN" @1.1.1.1 | tail -n1)
          [ "$got" = "$PROD_HOST" ] || { echo "::error::cms.$DOMAIN resolves to '${got:-nothing}', expected $PROD_HOST."; exit 1; }
          echo "Images exist and cms.$DOMAIN resolves to $PROD_HOST."

  deploy:
    needs: verify
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: production
      api_image: ${{ needs.verify.outputs.repo }}/zainstreat-api:${{ needs.verify.outputs.sha }}
      web_image: ${{ needs.verify.outputs.repo }}/zainstreat-web:${{ needs.verify.outputs.sha }}
      allow_env_changes: ${{ inputs.allow_env_changes }}
