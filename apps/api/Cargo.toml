[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
aws-sdk-s3 = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "rust_decimal", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id"] }
argon2 = "0.6"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
rpassword = "7"
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = { version = "0.10.4", default-features = false, features = ["std"] }
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# Admin web push (Phase 27 Decision 15): VAPID + aes128gcm in pure Rust,
# sent with reqwest over the rustls stack already in the build.
web-push-native = "0.5.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
base64ct = { version = "1.8.3", features = ["alloc"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
