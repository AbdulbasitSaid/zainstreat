x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Per-container memory/CPU ceilings for the 4 GB Lightsail box (Phase 18
# requirement.md Decision 4): a runaway service gets OOM-killed and
# restarted instead of hanging the whole host. memswap_limit == mem_limit
# so a capped container can't quietly eat the host's swap. Dev
# (docker-compose.yml) stays unlimited.
services:
  postgres:
    ports: !reset []
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    restart: unless-stopped
    <<: *default-logging

  minio:
    ports: !reset []
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    <<: *default-logging

  api:
    # Full image refs (ghcr.io/<owner>/zainstreat-api:<sha>) come from the
    # .env that _deploy.yml renders — no :latest (Phase 21 Decision 4).
    image: ${API_IMAGE:?API_IMAGE is required}
    build: !reset null
    working_dir: !reset null
    volumes: !reset []
    command: !reset null
    ports: !reset []
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_API_URL: https://api.${DOMAIN}
      PUBLIC_SITE_URL: https://${DOMAIN}
      PUBLIC_ADMIN_URL: https://cms.${DOMAIN}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    <<: *default-logging

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    working_dir: !reset null
    # Replaces the dev bind mounts with just the next/image optimizer cache,
    # so a deploy doesn't force every image to be re-encoded (Decision 6).
    volumes: !override
      - web_cache:/app/.next/cache
    command: !reset null
    ports: !reset []
    environment:
      # Only dynamically rendered metadata reads this; remotePatterns,
      # robots.txt and sitemap.xml use the build-time value (Dockerfile ARG DOMAIN).
      DOMAIN: ${DOMAIN}
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    restart: unless-stopped
    <<: *default-logging

  caddy:
    image: caddy:2-alpine
    # Only what the Caddyfile reads — not the whole .env, which would hand
    # Caddy every database and SMTP secret too.
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      NOINDEX: ${NOINDEX:-false}
      DOZZLE_BASIC_AUTH_USER: ${DOZZLE_BASIC_AUTH_USER}
      DOZZLE_BASIC_AUTH_HASH: ${DOZZLE_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - api
      - dozzle
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    <<: *default-logging

  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    restart: unless-stopped
    <<: *default-logging

volumes:
  caddy_data:
  caddy_config:
  web_cache:
