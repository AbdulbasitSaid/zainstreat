name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: zainstreat_test
          POSTGRES_PASSWORD: zainstreat_test
          POSTGRES_DB: zainstreat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zainstreat_test -d zainstreat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Actions' `services:` block can't override a container's
      # command (needed for alpine/minio's `server /data ...` args — see
      # docker-compose.yml's comment on this image), so MinIO runs as a
      # plain background container instead, reachable at localhost:9000
      # exactly like the Postgres service above. `-u 0:0` works around the
      # same non-root-can't-write-to-/data issue docker-compose.yml notes.
      - name: Start MinIO
        run: |
          docker run -d --name minio -u 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=zainstreat_test \
            -e MINIO_ROOT_PASSWORD=zainstreat_test \
            alpine/minio:RELEASE.2025-10-15T17-29-55Z server /data --console-address ":9001"
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          exit 1

      - name: Run API tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgres://zainstreat_test:zainstreat_test@localhost:5432/zainstreat_test
          SQLX_OFFLINE: "true"
          MINIO_ENDPOINT: http://localhost:9000
          MINIO_ACCESS_KEY: zainstreat_test
          MINIO_SECRET_KEY: zainstreat_test
        run: cargo test

  build-and-push:
    needs: test-api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.owner.outputs.lc }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase repository owner
        id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lc=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/zainstreat-web:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/zainstreat-web:${{ github.sha }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/zainstreat-api:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/zainstreat-api:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,Caddyfile"
          target: /opt/zainstreat
          strip_components: 0
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/zainstreat
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy
