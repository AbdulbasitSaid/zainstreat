name: Build

# Phase 21: after CI passes on master, build images tagged by commit SHA
# (never :latest). Production only changes through promote.yml; staging is
# redeployed here automatically, but only while it's up.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: build-${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      repo: ${{ steps.meta.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Image names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.repo }}/zainstreat-api:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # DOMAIN is baked in at build time (Phase 19), so production gets its
      # own web image; staging's is built below for staging's domain.
      - name: Build and push production web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            DOMAIN=${{ vars.DOMAIN }}
          tags: ${{ steps.meta.outputs.repo }}/zainstreat-web:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Summary
        run: |
          {
            echo "### Built ${{ steps.meta.outputs.sha }}"
            echo "Deploy to production with **Promote** using this SHA."
          } >> "$GITHUB_STEP_SUMMARY"

  staging-check:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.staging.outputs.up }}
      ip: ${{ steps.staging.outputs.ip }}
      domain: ${{ steps.staging.outputs.domain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: staging
        uses: ./.github/actions/staging-host
        with:
          role-arn: ${{ vars.AWS_ROLE_ARN }}
          region: ${{ vars.AWS_REGION }}
          dns-suffix: ${{ vars.STAGING_DNS_SUFFIX }}

  staging-web:
    needs: [build, staging-check]
    if: needs.staging-check.outputs.up == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            DOMAIN=${{ needs.staging-check.outputs.domain }}
          tags: ${{ needs.build.outputs.repo }}/zainstreat-web-staging:${{ needs.build.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web-staging,mode=max

  deploy-staging:
    needs: [build, staging-check, staging-web]
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      host: ${{ needs.staging-check.outputs.ip }}
      domain: ${{ needs.staging-check.outputs.domain }}
      api_image: ${{ needs.build.outputs.repo }}/zainstreat-api:${{ needs.build.outputs.sha }}
      web_image: ${{ needs.build.outputs.repo }}/zainstreat-web-staging:${{ needs.build.outputs.sha }}
