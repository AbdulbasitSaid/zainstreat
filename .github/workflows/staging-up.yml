name: Staging up

# Phase 21: create (or redeploy) the ephemeral staging box. Lightsail bills
# a stopped instance in full, so staging is deleted when not in use
# (staging-down.yml) and rebuilt here from infra/bootstrap.sh, then
# deployed, seeded and given an admin. No custom domain: <ip>.sslip.io.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to deploy (must already be built by Build); empty = the branch you run this from
        required: false
        default: ""

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: staging-up

env:
  INSTANCE: zainstreat-staging

jobs:
  provision:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      ip: ${{ steps.ip.outputs.ip }}
      domain: ${{ steps.ip.outputs.domain }}
      sha: ${{ steps.sha.outputs.sha }}
      repo: ${{ steps.sha.outputs.repo }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SHA and check the api image exists
        id: sha
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${OWNER,,}"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect "$repo/zainstreat-api:$SHA" > /dev/null \
            || { echo "::error::$repo/zainstreat-api:$SHA doesn't exist yet. Wait for the Build workflow, or pass a built SHA."; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Re-running while staging is up redeploys in place, keeping its
      # certificates (Decision 17).
      - name: Create instance if missing
        env:
          DEPLOY_SSH_PUBLIC_KEY: ${{ vars.DEPLOY_SSH_PUBLIC_KEY }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if aws lightsail get-instance --instance-name "$INSTANCE" > /dev/null 2>&1; then
            echo "$INSTANCE already exists; redeploying in place."
            exit 0
          fi
          test -n "$DEPLOY_SSH_PUBLIC_KEY" || { echo "::error::Set DEPLOY_SSH_PUBLIC_KEY on the staging Environment."; exit 1; }
          # The cheapest dual-stack 2 GB Linux bundle (IPv6-only bundles can't
          # serve IPv4 clients or reach GHCR over IPv4).
          bundle=$(aws lightsail get-bundles --query "sort_by(bundles[?ramSizeInGb==\`2.0\` && isActive && contains(supportedPlatforms, 'LINUX_UNIX') && !contains(bundleId, 'ipv6')], &price)[0].bundleId" --output text)
          echo "Bundle: $bundle"
          sed "s|__DEPLOY_SSH_PUBLIC_KEY__|$DEPLOY_SSH_PUBLIC_KEY|" infra/bootstrap.sh > user-data.sh
          aws lightsail create-instances \
            --instance-names "$INSTANCE" \
            --availability-zone "${REGION}a" \
            --blueprint-id amazon_linux_2023 \
            --bundle-id "$bundle" \
            --user-data file://user-data.sh \
            --tags key=env,value=staging > /dev/null

      - name: Wait until running
        run: |
          for i in $(seq 1 60); do
            state=$(aws lightsail get-instance-state --instance-name "$INSTANCE" --query state.name --output text)
            [ "$state" = "running" ] && exit 0
            echo "State: $state"
            sleep 10
          done
          echo "::error::$INSTANCE didn't reach running in 10 minutes."
          exit 1

      - name: Open ports 22, 80, 443
        run: |
          aws lightsail put-instance-public-ports --instance-name "$INSTANCE" --port-infos \
            'fromPort=22,toPort=22,protocol=tcp,cidrs=0.0.0.0/0,ipv6Cidrs=::/0' \
            'fromPort=80,toPort=80,protocol=tcp,cidrs=0.0.0.0/0,ipv6Cidrs=::/0' \
            'fromPort=443,toPort=443,protocol=tcp,cidrs=0.0.0.0/0,ipv6Cidrs=::/0' > /dev/null

      - name: Public IP and domain
        id: ip
        env:
          SUFFIX: ${{ vars.STAGING_DNS_SUFFIX || 'sslip.io' }}
        run: |
          ip=$(aws lightsail get-instance --instance-name "$INSTANCE" --query instance.publicIpAddress --output text)
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          echo "domain=${ip//./-}.$SUFFIX" >> "$GITHUB_OUTPUT"
          echo "Staging: $ip → ${ip//./-}.$SUFFIX"

  build-web:
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.provision.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging web
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          push: true
          build-args: |
            DOMAIN=${{ needs.provision.outputs.domain }}
          tags: ${{ needs.provision.outputs.repo }}/zainstreat-web-staging:${{ needs.provision.outputs.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web-staging,mode=max

  deploy:
    needs: [provision, build-web]
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: staging
      host: ${{ needs.provision.outputs.ip }}
      domain: ${{ needs.provision.outputs.domain }}
      api_image: ${{ needs.provision.outputs.repo }}/zainstreat-api:${{ needs.provision.outputs.sha }}
      web_image: ${{ needs.provision.outputs.repo }}/zainstreat-web-staging:${{ needs.provision.outputs.sha }}

  seed:
    needs: [provision, deploy]
    runs-on: ubuntu-latest
    environment: staging
    env:
      C: docker compose -f docker-compose.yml -f docker-compose.prod.yml
      DOMAIN: ${{ needs.provision.outputs.domain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: ./.github/actions/ssh-target
        with:
          host: ${{ needs.provision.outputs.ip }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Seed the menu
        run: |
          ssh target "cd /opt/zainstreat && $C exec -T postgres sh -c 'psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"'" < apps/api/seed.sql

      - name: Create the staging admin
        env:
          ADMIN_EMAIL: ${{ vars.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME || 'Staging Admin' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "::warning::ADMIN_EMAIL/ADMIN_PASSWORD not set on staging; skipping admin creation."
            exit 0
          fi
          printf '%s\n' "$ADMIN_PASSWORD" | ssh target "cd /opt/zainstreat && $C exec -T api create_admin --email '$ADMIN_EMAIL' --name '$ADMIN_NAME' --password-stdin"

      - name: Summary
        run: |
          issuer=$(echo | openssl s_client -connect "$DOMAIN:443" -servername "$DOMAIN" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || echo "unknown")
          {
            echo "### Staging is up"
            echo "- Site: https://$DOMAIN/en"
            echo "- Admin: https://cms.$DOMAIN"
            echo "- Logs: https://logs.$DOMAIN"
            echo "- Certificate $issuer"
            echo
            echo "Run **Staging down** when you're done — it's billed hourly while it exists."
          } >> "$GITHUB_STEP_SUMMARY"
